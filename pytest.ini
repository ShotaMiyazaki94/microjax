[pytest]
addopts = -m "not gpu and not slow"
markers =
    gpu: tests that require a CUDA GPU and are opt-in via the `gpu` marker (`pytest -m gpu`)
    slow: long-running numerical regression tests that are excluded from the standard test suite
testpaths =
    tests/unittests
pythonpath =
    src
norecursedirs =
    tests/integrate
