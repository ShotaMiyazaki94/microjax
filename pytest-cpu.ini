[pytest]
addopts = -m "not gpu and not slow"
markers =
    gpu: tests that require a CUDA GPU and are opt-in via the `gpu` marker (`pytest -m gpu`)
    fast: representative CPU smoke tests for the development loop
    slow: long-running numerical and CPU AD regression tests excluded from the standard test suite
testpaths =
    tests/unittests
pythonpath =
    src
norecursedirs =
    tests/integrate
