name: Run pytest
on:
  # Triggers the workflow on push or pull request events but only for the "develop" and "master" branch
  push:
    branches: [ "develop" , "master"]
  pull_request:
    branches: [ "develop" , "master"]


jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest and generate JUnit report
        run: |
          mkdir -p results
          pytest -m "not gpu and not slow" -q --durations=20 --junit-xml=results/pytest.xml

      - name: Upload Pytest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results (Python 3.10)
          path: results/pytest.xml

      - name: Publish Unit Test Summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: results/pytest.xml
  
