name: Numerical Audit (CPU)

on:
  workflow_dispatch:

jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow numerical regression tests
        run: |
          mkdir -p results
          pytest -m slow -q --durations=30 --junit-xml=results/numerical-audit.xml

      - name: Upload numerical audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Numerical Audit Results (Python 3.10)
          path: results/numerical-audit.xml
