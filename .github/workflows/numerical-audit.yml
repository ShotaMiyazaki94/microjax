name: CPU Critical Benchmark

on:
  workflow_dispatch:

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project
        run: python -m pip install -e .

      - name: Run critical LD value check and Jacobian timing
        run: python tools/cpu_benchmark.py --output results/cpu-benchmark.json
